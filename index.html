  <canvas id="particle-canvas"></canvas>

  <script>
    const e = React.createElement;
    const { useState, useEffect, createContext, useContext, useRef } = React;

    const LOGO_SRC = "novalogo.png";

    // --- Sadece Bırakıldığında Yavaşlayarak Duran Kaydırma ---
    const initInertiaScroll = () => {
      let currentY = window.scrollY;
      let velocity = 0;
      let isWheelActive = false;
      let wheelTimeout = null;
      let animFrame = null;

      const updateScroll = () => {
        if (!isWheelActive) {
          velocity *= 0.92;
          currentY += velocity;
          
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          currentY = Math.max(0, Math.min(currentY, maxScroll));
          window.scrollTo(0, currentY);

          if (Math.abs(velocity) > 0.1) {
            animFrame = requestAnimationFrame(updateScroll);
          } else {
            velocity = 0;
          }
        }
      };

      const onWheel = (e) => {
        isWheelActive = true;
        currentY = window.scrollY;
        
        const scrollDelta = e.deltaY;
        window.scrollBy(0, scrollDelta);
        currentY = window.scrollY;

        velocity = scrollDelta * 0.4;

        clearTimeout(wheelTimeout);
        if (animFrame) cancelAnimationFrame(animFrame);

        wheelTimeout = setTimeout(() => {
          isWheelActive = false;
          animFrame = requestAnimationFrame(updateScroll);
        }, 50);
      };

      window.addEventListener('wheel', onWheel, { passive: true });
    };

    // --- Partikül Arka Planı ---
    const initParticles = () => {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let width, height;

      const resize = () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      };
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 1.5 + 0.5;
          this.speedX = Math.random() * 0.4 - 0.2;
          this.speedY = Math.random() * 0.4 - 0.2;
          this.baseColor = Math.random() > 0.5 ? '#00F0FF' : '#A04BFF';
          this.alpha = Math.random() * 0.5 + 0.1;
        }
        update(mouseX, mouseY) {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x > width) this.x = 0; if (this.x < 0) this.x = width;
          if (this.y > height) this.y = 0; if (this.y < 0) this.y = height;

          if (mouseX && mouseY) {
            let dx = mouseX - this.x;
            let dy = mouseY - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 150) {
              let force = (150 - dist) / 150;
              this.x -= dx * force * 0.02;
              this.y -= dy * force * 0.02;
            }
          }
        }
        draw() {
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = this.baseColor;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      for (let i = 0; i < 90; i++) particles.push(new Particle());

      let mouseX = null, mouseY = null;
      window.addEventListener('mousemove', (ev) => { mouseX = ev.clientX; mouseY = ev.clientY; });

      const animate = () => {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update(mouseX, mouseY);
          p.draw();
        });

        ctx.globalAlpha = 0.05;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      };
      animate();
    };

    const translations = {

          downloadBtn: "İndir",

        },

          hero: {

          },
          contact: { overline: "GET IN TOUCH", title: "Do you have a suggestion? Let's connect.", infoTitle: "INFO", form: { name: "Full Name", message: "Message", submit: "Send" } },
          footer: { copyright: "© 2026 Nova AI. All rights reserved." },

        footer: { copyright: "© 2026 Nova AI. Tüm hakları saklıdır." },

    const LangContext = createContext();

    function AnimText({ children, className = "" }) {

    function Header() {
      const { lang, setLang, t } = useContext(LangContext);
      return e('header', { className: 'fixed top-0 left-0 w-full z-50 glass border-b border-white/5 px-6 md:px-12 py-4 flex items-center justify-between' },

          e('span', { className: 'font-display font-extrabold text-2xl tracking-tighter text-white' }, 'NOVA', e('span', { className: 'text-nova-cyan' }, '.AI'))
        ),
        e('nav', { className: 'hidden md:flex items-center gap-10 text-xs font-mono font-medium text-nova-muted uppercase tracking-widest' },
          ['services', 'why', 'contact'].map(item => 
            e('a', { key: item, href: '#contact', className: 'hover:text-white transition-colors relative group' }, 
              e(AnimText, null, t.nav[item]),
              e('span', { className: 'absolute -bottom-1 left-0 w-0 h-px bg-nova-cyan group-hover:w-full transition-all duration-300' })
            )
          )
        ),
        e('div', { className: 'flex items-center gap-4' },
          e('button', {
            onClick: () => setLang(lang === 'tr' ? 'en' : 'tr'),
            className: 'text-[10px] font-mono px-3 py-1.5 rounded bg-white/5 border border-white/10 hover:border-nova-cyan transition-all uppercase cursor-pointer'
          }, lang),
          e('a', { href: '#contact', className: 'btn-neon px-6 py-2.5 rounded-full text-xs font-bold tracking-wider uppercase text-white' }, 
            e(AnimText, null, t.nav.cta)
          )
        )
      );
    }

    function Hero() {
      const { lang, t } = useContext(LangContext);
      const podRef = useRef(null);

      useEffect(() => {
        const pod = podRef.current;
        if (!pod) return;
        const handleMove = (ev) => {
          const rect = pod.getBoundingClientRect();
          const x = ev.clientX - rect.left - rect.width/2;
          const y = ev.clientY - rect.top - rect.height/2;
          pod.style.transform = `rotateX(${-y/20}deg) rotateY(${x/20}deg) translateZ(10px)`;
        };
        const handleLeave = () => { pod.style.transform = `rotateX(0deg) rotateY(0deg) translateZ(0px)`; };
        
        const container = pod.parentElement;
        container.addEventListener('mousemove', handleMove);
        container.addEventListener('mouseleave', handleLeave);
        return () => {
          container.removeEventListener('mousemove', handleMove);
          container.removeEventListener('mouseleave', handleLeave);
        };
      }, []);

      return e('section', { className: 'min-h-screen pt-32 pb-20 px-6 md:px-12 grid md:grid-cols-[1fr,auto] gap-12 items-center relative overflow-hidden' },
        e('div', { className: 'relative z-10' },
          e('div', { className: 'fade-up inline-flex items-center gap-2 px-3 py-1 rounded-full border border-nova-cyan/20 bg-nova-cyan/5 text-nova-cyan text-[10px] font-mono mb-6 tracking-widest animate-pulse-slow' }, 
            e('span', { className: 'w-1.5 h-1.5 rounded-full bg-nova-cyan animate-pulse' }),
            e(AnimText, null, t.hero.badge)
          ),
          e('div', { className: 'fade-up text-nova-muted font-mono text-xs uppercase tracking-widest mb-2' }, 
            e(AnimText, null, t.hero.overline)
          ),
          
          /* Kesinlikle Görünür Neon Başlık */
          e('h1', { className: 'fade-up text-5xl md:text-7xl font-extrabold max-w-4xl font-display leading-[0.95] mb-6 tracking-tighter' },
            e(AnimText, null, t.hero.title), ' ',
            e('span', { key: lang, className: 'text-gradient-neon animate-lang-switch mx-1' }, t.hero.aiText), ' ',
            t.hero.titleEnd && e(AnimText, null, t.hero.titleEnd)
          ),
          
          e('p', { className: 'fade-up text-nova-muted max-w-xl text-base md:text-lg mb-10 leading-relaxed font-light' }, 
            e(AnimText, null, t.hero.subtitle)
          ),
          
          e('div', { className: 'fade-up flex flex-wrap gap-4 items-center' },
            e('a', { href: '#contact', className: 'btn-neon px-8 py-4 rounded-full font-bold text-sm tracking-wider uppercase text-white group' }, 
              e(AnimText, null, t.nav.cta),

            ),

    }

    function ChatWidget() {
      const { t } = useContext(LangContext);
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([{ role: 'ai', text: t.chat.welcome }]);
      const [input, setInput] = useState("");

      const handleSend = (ev) => {
        ev.preventDefault();
        if (!input.trim()) return;
        const newMsgs = [...messages, { role: 'user', text: input }];
        setMessages(newMsgs);
        setInput("");
        setTimeout(() => {
          setMessages([...newMsgs, { role: 'ai', text: "Atomik veri ağımız mesajınızı işliyor. Ekiplerimiz en kısa sürede dönecektir." }]);
        }, 1200);
      };

      return e('div', { className: 'fixed bottom-8 right-8 z-50' },
        isOpen && e('div', { className: 'glass w-80 md:w-96 rounded-2xl overflow-hidden shadow-2xl border border-white/10 mb-4 animate-fade-up' },

          ),

            e('input', {
              type: 'text',

              onChange: (ev) => setInput(ev.target.value),

              className: 'flex-1 bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-xs text-white focus:outline-none focus:border-nova-cyan'
            }),
            e('button', { type: 'submit', className: 'btn-neon px-4 py-2.5 rounded-lg text-xs font-bold text-white cursor-pointer' }, '➤')
          )
        ),
        e('button', {
          onClick: () => setIsOpen(!isOpen),
          className: 'btn-neon p-5 rounded-full flex items-center justify-center shadow-lg text-xl cursor-pointer group'
        }, e('img', { src: LOGO_SRC, className: 'w-6 h-6 rounded-full object-cover group-hover:scale-110 transition-transform' }))
      );
    }

    function Footer() {
      const { t } = useContext(LangContext);
      return e('footer', { className: 'py-10 px-6 border-t border-white/5 text-center text-[10px] font-mono text-nova-dim tracking-wider uppercase fade-in' },
        e('img', { src: LOGO_SRC, className: 'w-6 h-6 rounded-full mx-auto mb-4 opacity-30 object-cover' }),
        e('p', null, e(AnimText, null, t.footer.copyright))
      );
    }

    function App() {
      const [lang, setLang] = useState('tr');
      const t = translations[lang];

      useEffect(() => {
        initParticles();
        initInertiaScroll();
      }, []);

      return e(LangContext.Provider, { value: { lang, setLang, t } },
        e('div', { className: 'min-h-screen bg-nova-bg text-white relative' },
          e(Header),
          e('main', null,
            e(Hero),
            e(MarqueeBanner),
            e(Contact)
          ),
          e(Footer),
          e(ChatWidget)
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
